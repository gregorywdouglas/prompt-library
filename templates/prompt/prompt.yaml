id: domain.prompt-name
name: Human-Readable Prompt Name
version: 0.1.0
description: >
  One or two sentences: what this prompt does and when to use it.
owner: "@your-github-handle"
status: draft
tags: []

model:
  provider: anthropic
  name: claude-sonnet-5
  temperature: 0
  max_tokens: 2048

variables:
  - name: input
    description: The primary input.

template:
  system: |
    You are ... (role). Your goal is ... (goal).
    Rules, each with the reason it exists.
  user: |
    <input>
    {{input}}
    </input>

    Output format: ...

output:
  format: markdown

changelog:
  - version: 0.1.0
    date: 2026-01-01
    notes: First draft.
