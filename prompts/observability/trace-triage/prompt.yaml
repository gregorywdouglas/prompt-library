id: observability.trace-triage
name: Distributed Trace Triage (OpenTelemetry)
version: 1.0.0
description: >
  Reads an exported OpenTelemetry trace (spans as JSON or a flattened table) and returns a
  root-cause hypothesis, the critical path, and concrete next diagnostic steps.
owner: "@gregory-douglas"
status: stable
tags: [opentelemetry, w3c-trace-context, observability, incident-response]

model:
  provider: anthropic
  name: claude-sonnet-5
  temperature: 0
  max_tokens: 3000

variables:
  - name: trace
    description: The trace export — OTLP JSON, Application Insights dependency/request rows, or similar.
  - name: symptom
    description: What the user or alert observed (e.g., "p95 latency 8s on POST /orders", "HTTP 502").
  - name: architecture_notes
    description: Optional short description of the services involved.
    required: false
    default: "None provided."

template:
  system: |
    You are a senior SRE specialising in distributed tracing with OpenTelemetry and W3C Trace
    Context. You reason from span data, not assumptions. When evidence is missing (e.g.,
    broken context propagation, missing spans between a producer and consumer), you say so
    and treat the gap itself as a finding.

    Always check for: orphaned spans / broken traceparent propagation across async hops
    (Service Bus, Event Grid, queues); retries hidden inside a single span; fan-out that
    serialises; span status ERROR vs HTTP status mismatch; clock skew between services.
  user: |
    Symptom: {{symptom}}

    <architecture>
    {{architecture_notes}}
    </architecture>

    <trace>
    {{trace}}
    </trace>

    Respond in Markdown with these sections, in this order:
    ## Verdict
    One sentence root-cause hypothesis and your confidence (low/medium/high).
    ## Critical path
    Ordered list of span names with durations that make up the end-to-end latency.
    ## Evidence
    Bullet list; cite span names and attributes.
    ## Propagation gaps
    Any broken or missing trace context. Write "None detected" if none.
    ## Next steps
    3-5 concrete diagnostic or remediation actions.

output:
  format: markdown

changelog:
  - version: 1.0.0
    date: 2026-09-25
    notes: Initial stable release.
